name: Network tests

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same pull request or to main makes the running tests
# pointless, so they are cancelled.
concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # make network-test: the debug app on an Android emulator joins the network
  # of a QEMU VM running edgevpn (scripts/testpeer), pings it both ways, turns
  # off for longer than the VM's 60 second ownership TTL and checks that
  # traffic comes back after turning on again. The network key is a
  # temporary one the VM generates for the run, so the job needs no secret.
  # make network-test-address-in-use then moves the VM to the app's address
  # and checks that the app warns about it.
  network:
    name: Network tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # One SDK and one adb for the build, the emulator runner and the test,
      # as in the E2E tests job.
      ANDROID_HOME: ${{ github.workspace }}/binaries/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/binaries/android-sdk
      JAVA_HOME: ${{ github.workspace }}/binaries/jdk-17
    steps:
      - uses: actions/checkout@v7

      # The emulator refuses to start when the runner has less free disk than
      # its userdata partition needs. The runner image ships toolchains this
      # job never touches: it builds with its own Android SDK, JDK and Go under
      # binaries/ and the Go setup action, and runs no containers. Deleting
      # them frees several GB before the caches are restored into the space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum

      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      # Every cache below is restored here and saved by its own step as soon
      # as its contents are ready, so a failed test still leaves them for the
      # next run. A pull request can only read caches saved by its own runs
      # or by main, so a cache lost on main means a slow first run on every
      # new pull request. The E2E tests job explains the same layout.

      # The same tools cache as every other workflow (see the unit tests
      # job). The test peer's files are cached below under a key of their
      # own.
      - name: Restore the build tools
        id: tools-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            binaries
            !binaries/android-sdk/emulator
            !binaries/android-sdk/system-images
            !binaries/testpeer
          key: build-tools-${{ hashFiles('Makefile', 'golib/go.mod') }}

      - name: Restore the emulator and system image
        id: emulator-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            binaries/android-sdk/emulator
            binaries/android-sdk/system-images/android-35/default/x86_64
          key: android-sdk-emulator-35-default-x86_64

      - name: Restore the device and its snapshot
        id: avd-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-35-default-x86_64-disk2g-pixel6-clean

      # The emulator writes lock files into the device directory that hold
      # its process ID, such as snapshot.lock.lock, and can leave them behind
      # when it is killed, so the cached device carries them. On a new runner
      # the emulator treats a lock as held when any live process has that ID,
      # and exits with "A snapshot operation for 'test' is pending and timeout
      # has expired". Nothing runs the device at this point, so every lock in
      # it is stale.
      - name: Remove stale emulator locks from the cached device
        run: if [ -d ~/.android/avd ]; then find ~/.android/avd -name '*.lock' -type f -print -delete; fi

      # The Debian cloud image and the edgevpn binary built for the VM. The
      # script names both by version, and the key changes with the script
      # (which pins the image) and with go.mod (which pins edgevpn).
      - name: Restore the test peer's image and edgevpn
        id: testpeer-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            binaries/testpeer/*.qcow2
            binaries/testpeer/edgevpn-*
          key: testpeer-${{ hashFiles('scripts/testpeer', 'golib/go.mod') }}

      - name: Build the app and the tests
        run: make e2e-build

      - name: Save the build tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            binaries
            !binaries/android-sdk/emulator
            !binaries/android-sdk/system-images
            !binaries/testpeer
          key: build-tools-${{ hashFiles('Makefile', 'golib/go.mod') }}

      # Installed here rather than left to the emulator runner; see the E2E
      # tests job.
      - name: Install the emulator and system image, only when not cached
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: scripts/ci-install-emulator

      - name: Save the emulator and system image
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            binaries/android-sdk/emulator
            binaries/android-sdk/system-images/android-35/default/x86_64
          key: android-sdk-emulator-35-default-x86_64

      # The emulator and the VM both need hardware acceleration, and the
      # runner ships /dev/kvm owned by a group the job's user is not in.
      - name: Let this job use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Started before the emulator, so a VM that cannot boot fails the job
      # early and on its own.
      - name: Start the test peer
        run: make peer-up

      - name: Save the test peer's image and edgevpn
        if: steps.testpeer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            binaries/testpeer/*.qcow2
            binaries/testpeer/edgevpn-*
          key: testpeer-${{ hashFiles('scripts/testpeer', 'golib/go.mod') }}

      - name: Create the device, only when it is not cached
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          force-avd-creation: false
          # A small userdata partition, so the AVD fits in what the runner has
          # left. The create step and the run step must agree, because they
          # share one cached AVD.
          disk-size: 2048M
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Device created and snapshotted for the cache."

      - name: Remove emulator locks before caching the device
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: if [ -d ~/.android/avd ]; then find ~/.android/avd -name '*.lock' -type f -print -delete; fi

      - name: Save the device and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-35-default-x86_64-disk2g-pixel6-clean

      # The runner's emulator is emulator-5554.
      - name: Run the network test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          force-avd-creation: false
          # A small userdata partition, so the AVD fits in what the runner has
          # left. The create step and the run step must agree, because they
          # share one cached AVD.
          disk-size: 2048M
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The basic check, then the address-in-use check against the same
          # peer, in one emulator boot.
          script: make network-test ANDROID_SERIAL=emulator-5554 && make network-test-address-in-use ANDROID_SERIAL=emulator-5554

      # The VM's console log, which also covers a VM that never came up and
      # so never reached the test. The script replaces the key in it.
      - name: Show the VM's console log
        if: failure()
        run: |
          mkdir -p build/network-test
          scripts/testpeer serial > build/network-test/testpeer-serial.log || true
          tail -n 60 build/network-test/testpeer-serial.log

      # The app's log, the VM's edgevpn and console logs and the screenshots.
      # The logs have the key replaced with a placeholder wherever it shows
      # up. The screenshots are not scrubbed; they show only the app's
      # screens for this run's throwaway key.
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: network-test-logs
          path: build/network-test/
          if-no-files-found: ignore

      - name: Stop the test peer
        if: always()
        run: make peer-down
